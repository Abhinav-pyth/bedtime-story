<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    
    <!-- Primary Meta Tags -->
    <title id="meta-title">DreamyTales – Magical Bedtime Stories for Kids</title>
    <meta id="meta-description" name="description" content="Discover 20 magical bedtime stories with calming narration, sleep sounds, and night mode. Perfect for children ages 3-10. Sweet dreams await!" />
    <meta name="keywords" content="bedtime stories, children stories, kids sleep, magical stories, fairy tales, sleep sounds, bedtime app, kids app, stories for kids, relaxing stories, night stories, dreamy tales" />
    <meta name="author" content="DreamyTales" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dreamytales.app/" />
    
    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="application-name" content="DreamyTales" />

    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dreamytales.app/" />
    <meta name="twitter:title" id="twitter-title" content="DreamyTales – Magical Bedtime Stories for Kids" />
    <meta name="twitter:description" id="twitter-description" content="Discover 20 magical bedtime stories with calming narration, sleep sounds, and night mode. Perfect for children ages 3-10. Sweet dreams await!" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DreamyTales",
      "alternateName": "DreamyTales – Magical Bedtime Stories",
      "url": "https://dreamytales.app/",
      "description": "A premium bedtime story app with 20 magical stories, calming narration, sleep sounds, and night mode for children ages 3-10.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "127"
      },
      "featureList": [
        "20 Original Bedtime Stories",
        "Text-to-Speech Narration",
        "Ambient Sleep Sounds",
        "Sleep Timer",
        "Night Mode Themes",
        "Story Categories",
        "Favorites",
        "Reading Progress",
        "Parent Controls",
        "Offline Support"
      ],
      "audience": {
        "@type": "PeopleAudience",
        "suggestedMinAge": 3,
        "suggestedMaxAge": 10
      },
      "genre": ["Bedtime Stories", "Children's Literature", "Educational"],
      "inLanguage": "en",
      "isFamilyFriendly": true
    }
    </script>
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DreamyTales",
      "url": "https://dreamytales.app/",
      "logo": "https://dreamytales.app/icon-512.png",
      "description": "Creating magical bedtime experiences for children worldwide.",
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What age group is DreamyTales suitable for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DreamyTales is designed for children ages 3-10, with stories categorized by age appropriateness."
          }
        },
        {
          "@type": "Question",
          "name": "How many stories are available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DreamyTales features 20 original bedtime stories, each between 700-1200 words, covering magical, fantasy, animal, adventure, and moral themes."
          }
        },
        {
          "@type": "Question",
          "name": "Does DreamyTales work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! DreamyTales is a Progressive Web App that works offline once installed. All stories are available without an internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a sleep timer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DreamyTales includes a configurable sleep timer with options for 10, 20, 30, 45, or 60 minutes, plus an end-of-story option."
          }
        },
        {
          "@type": "Question",
          "name": "Can I listen to stories instead of reading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! DreamyTales uses text-to-speech narration with adjustable speed and voice selection, perfect for bedtime listening."
          }
        }
      ]
    }
    </script>
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #0f172a; color: #e2e8f0; }
      #root { min-height: 100vh; }
      /* Critical CSS for faster first paint */
      .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div style="text-align: center;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">🌙</div>
          <div style="color: #c4b5fd; font-size: 1.125rem;">Preparing your dreams...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
